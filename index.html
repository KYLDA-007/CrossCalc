<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CrossCalc</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
   <header>
    <h1>Crossover Calulator</h1>
    <p class="subtitle">Speaker crossover designer</p>
   </header>

   <main>
    <section id="settings">
        <h2>settings</h2>
        <label for="freq">Crossover frequency (Hz)</label>
        <input type="number" id="freq" value="2500" min="20" max="20000">
        <label for="WooferZ">Woofer impedance (&Omega;)</label>
        <input type="number" id="wooferZ" value="8" min="1" max="32">
        <label for="tweeterZ">Tweeter impedance (&Omega;)</label>
        <input type="number" id="tweeterZ" value="8" min="1" max="32">
        <label for="slope">Slope</label>
        <select id="slope">
            <option value="1">6dB/oct (1st)</option>
            <option value="2" selected>12dB/oct (2st)</option>
            <option value="3">18dB/oct (3st)</option>
            <option value="4">24dB/oct (4st)</option>
        </select>
        <label for="filterType">Filter Type</label>
        <select id="filterType">
            <option value="butterworth">Butterworth</option>
            <option value="linkwitz" selected>Linkwitz-Riley</option> 
        </select>
    </section>

    <section id="graph">
        <h2>Frequency response</h2>
        <canvas id="graphCanvas" width="800" height="400"></canvas>
    </section>

    <section id="schematic">
        <h2>Schematic</h2>
        <canvas id="schematicCanvas" width="700" height="360"></canvas>
    </section>
    <section id="results">
        <h2>Component values</h2>
        <div id="output"></div>
    </section>


   </main>
    <script src="script.js"></script>
</body>
</html>
